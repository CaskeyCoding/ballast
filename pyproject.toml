[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ballast"
version = "0.0.1"
description = "Self-healing RAG + guardrails gateway + eval CI/CD over one shared core"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "anthropic>=0.40",
  "boto3>=1.34",
  "numpy>=1.26",
  "langgraph>=0.2",
]

# Runtime dependencies are added per backlog item as each subsystem lands, so a
# fresh clone installs fast and local-ci stays green before the heavy ML stack
# (chromadb, sentence-transformers, langgraph) is actually needed.

[project.optional-dependencies]
chroma = ["chromadb>=1.0"]
dev = [
  "ruff==0.6.9",
  "mypy>=1.11",
  "pytest>=8.3",
  "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ballast = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["ballast"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "chromadb.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
