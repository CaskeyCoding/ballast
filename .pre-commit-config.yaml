# Optional local pre-commit hooks. Install with: pre-commit install
# These mirror the lint/type steps of scripts/local_ci.py so issues surface before commit.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check src tests
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check
        entry: python -m ruff format --check src tests
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        pass_filenames: false
